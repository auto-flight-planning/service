<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운항일정기획 - 진행단계별 상태</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        background: #e0f2fe;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .stage-section {
        margin-bottom: 60px;
      }

      .stage-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #374151;
        margin-bottom: 30px;
        text-align: center;
      }

      /* Project Header */
      .project-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
        gap: 40px;
      }

      .project-info {
        flex: 1;
      }

      .project-title-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 8px;
        position: relative;
      }

      .project-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #374151;
        margin: 0;
      }

      .project-period {
        font-size: 0.9rem;
        color: #6b7280;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .participants-btn {
        background: rgba(255, 255, 255, 0.7);
        color: #374151;
        border: 1px solid rgba(229, 231, 235, 0.8);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 4px;
        backdrop-filter: blur(10px);
      }

      .participants-btn:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-1px);
      }

      /* Progress Bar */
      .progress-container {
        flex: 1.5;
        min-width: 400px;
      }

      .progress-steps {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      .progress-line {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        height: 3px;
        background: rgba(255, 255, 255, 0.4);
        z-index: 1;
        border-radius: 3px;
      }

      .progress-line-fill {
        height: 100%;
        background: linear-gradient(90deg, #0284c7, #0369a1);
        transition: width 0.5s ease;
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(2, 132, 199, 0.3);
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 2;
      }

      .step-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        margin-bottom: 10px;
        transition: all 0.3s ease;
        border: 2px solid rgba(229, 231, 235, 0.8);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
      }

      .step.active .step-circle {
        background: #0284c7;
        color: white;
        transform: scale(1.1);
        border-color: #0284c7;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      }

      .step.completed .step-circle {
        background: #0284c7;
        color: white;
        border-color: #0284c7;
        box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
      }

      .step.adopted .step-circle {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border-color: #10b981;
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
        animation: adoptedPulse 2s infinite;
      }

      @keyframes adoptedPulse {
        0% {
          box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
        }
        50% {
          box-shadow: 0 4px 16px rgba(16, 185, 129, 0.8), 0 0 0 8px rgba(16, 185, 129, 0.1);
        }
        100% {
          box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
        }
      }

      .step-label {
        font-size: 0.85rem;
        color: #6b7280;
        font-weight: 500;
        text-align: center;
      }

      .step.active .step-label {
        color: #0284c7;
        font-weight: 700;
      }

      .step.adopted .step-label {
        color: #10b981;
        font-weight: 700;
      }

      /* 입력 단계 스타일 */
      .input-stage .progress-line-fill {
        width: 0%;
      }

      /* 결과 단계 스타일 */
      .result-stage .progress-line-fill {
        width: 33.33%;
      }

      /* 검토 단계 스타일 */
      .review-stage .progress-line-fill {
        width: 66.66%;
      }

      /* 채택 단계 스타일 */
      .adoption-stage .progress-line-fill {
        width: 100%;
        background: linear-gradient(90deg, #0284c7 0%, #0284c7 75%, #10b981 100%);
      }

      @media (max-width: 768px) {
        .project-header {
          flex-direction: column;
          gap: 20px;
        }

        .progress-container {
          margin-left: 0;
          max-width: 100%;
        }

        .project-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 1. 입력 단계 -->
      <div class="stage-section">
        <h2 class="stage-title">1. 入力段階</h2>
        <div class="project-header">
          <div class="project-info">
            <div class="project-title-container">
              <h1 class="project-title">2026.04運航日程</h1>
            </div>
            <div class="project-period">
              対象期間: 2026年4月
              <button class="participants-btn">
                👥 参加者 (4名)
              </button>
            </div>
          </div>

          <div class="progress-container input-stage">
            <div class="progress-steps">
              <div class="progress-line">
                <div class="progress-line-fill"></div>
              </div>
              
              <div class="step active">
                <div class="step-circle">1</div>
                <div class="step-label">入力</div>
              </div>
              
              <div class="step">
                <div class="step-circle">2</div>
                <div class="step-label">結果</div>
              </div>
              
              <div class="step">
                <div class="step-circle">3</div>
                <div class="step-label">検討</div>
              </div>
              
              <div class="step">
                <div class="step-circle">4</div>
                <div class="step-label">採択</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. 결과 단계 -->
      <div class="stage-section">
        <h2 class="stage-title">2. 結果段階</h2>
        <div class="project-header">
          <div class="project-info">
            <div class="project-title-container">
              <h1 class="project-title">2026.04運航日程</h1>
            </div>
            <div class="project-period">
              対象期間: 2026年4月
              <button class="participants-btn">
                👥 参加者 (4名)
              </button>
            </div>
          </div>

          <div class="progress-container result-stage">
            <div class="progress-steps">
              <div class="progress-line">
                <div class="progress-line-fill"></div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">1</div>
                <div class="step-label">入力</div>
              </div>
              
              <div class="step active">
                <div class="step-circle">2</div>
                <div class="step-label">結果</div>
              </div>
              
              <div class="step">
                <div class="step-circle">3</div>
                <div class="step-label">検討</div>
              </div>
              
              <div class="step">
                <div class="step-circle">4</div>
                <div class="step-label">採択</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 검토 단계 -->
      <div class="stage-section">
        <h2 class="stage-title">3. 検討段階</h2>
        <div class="project-header">
          <div class="project-info">
            <div class="project-title-container">
              <h1 class="project-title">2026.04運航日程</h1>
            </div>
            <div class="project-period">
              対象期間: 2026年4月
              <button class="participants-btn">
                👥 参加者 (4名)
              </button>
            </div>
          </div>

          <div class="progress-container review-stage">
            <div class="progress-steps">
              <div class="progress-line">
                <div class="progress-line-fill"></div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">1</div>
                <div class="step-label">入力</div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">2</div>
                <div class="step-label">結果</div>
              </div>
              
              <div class="step active">
                <div class="step-circle">3</div>
                <div class="step-label">検討</div>
              </div>
              
              <div class="step">
                <div class="step-circle">4</div>
                <div class="step-label">採択</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. 채택 단계 -->
      <div class="stage-section">
        <h2 class="stage-title">4. 採択段階</h2>
        <div class="project-header">
          <div class="project-info">
            <div class="project-title-container">
              <h1 class="project-title">2026.04運航日程</h1>
            </div>
            <div class="project-period">
              対象期間: 2026年4月
              <button class="participants-btn">
                👥 参加者 (4名)
              </button>
            </div>
          </div>

          <div class="progress-container adoption-stage">
            <div class="progress-steps">
              <div class="progress-line">
                <div class="progress-line-fill"></div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">1</div>
                <div class="step-label">入力</div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">2</div>
                <div class="step-label">結果</div>
              </div>
              
              <div class="step completed">
                <div class="step-circle">3</div>
                <div class="step-label">検討</div>
              </div>
              
              <div class="step adopted">
                <div class="step-circle">4</div>
                <div class="step-label">採択</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
